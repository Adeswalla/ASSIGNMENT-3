<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Registration Form</title>
  </head>
  <body>
    <h1>User Registration</h1>

    <form action="#" method="post">
      <table border="1" cellpadding="5" cellspacing="5">
        <tr>
          <td>
            <label for="name">Name:</label>
          </td>
          <td>
            <input type="text" id="name" name="name" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="email">Email:</label>
          </td>
          <td>
            <input type="email" id="email" name="email" required />
          </td>
        </tr>
        <tr>
          <td>
            <label for="password">Password:</label>
          </td>
          <td>
            <input type="password" id="password" name="password" required />
          </td>
        </tr>
        <tr>
          <td>
            <label>Gender:</label>
          </td>
          <td>
            <input type="radio" id="male" name="gender" value="male" required />
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" />
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other" />
            <label for="other">Other</label>
          </td>
        </tr>
        <tr>
          <td>
            <label>Hobbies:</label>
          </td>
          <td>
            <input
              type="checkbox"
              id="reading"
              name="hobbies[]"
              value="reading"
            />
            <label for="reading">Reading</label>

            <input
              type="checkbox"
              id="sports"
              name="hobbies[]"
              value="sports"
            />
            <label for="sports">Sports</label>

            <input type="checkbox" id="music" name="hobbies[]" value="music" />
            <label for="music">Music</label>

            <input
              type="checkbox"
              id="travel"
              name="hobbies[]"
              value="travel"
            />
            <label for="travel">Travel</label>
          </td>
        </tr>
        <tr>
          <td colspan="2"><input type="submit" value="Submit" /></td>
        </tr>
      </table>
    </form>

    <figure>
      <audio controls>
        <source src="./Every Type of Wealth (Explained).mp4" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>

      <figcaption>Every Type of Wealth Explained</figcaption>
      <a href="audio.mp3" download>Download Audio</a>
    </figure>

    <figure>
      <video controls width="400">
        <source src="./Every Type of Wealth (Explained).mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>

      <figcaption>Every Type of Wealth Explained</figcaption>
      <a href="video.mp4" download>Download Video</a>
    </figure>
  </body>
</html>
